# Databases for ProjectPulse. Start them with:  docker compose up -d
# PostgreSQL (with pgvector) is published on port 5433 so it never clashes with a
# PostgreSQL you may already have installed on 5432. Data survives restarts (named volumes).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_pulse
    ports:
      - "5433:5432"
    volumes:
      - pulse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_pulse"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: pulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - pulse-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      retries: 10

volumes:
  pulse-pg:
  pulse-mongo:
